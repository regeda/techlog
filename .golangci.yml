version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - cyclop
    - dupword
    - errname
    - errorlint
    - funlen
    - gocognit
    - gocritic
    - godot
    - godox
    - gosec
    - misspell
    - nestif
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    cyclop:
      max-complexity: 10
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
    funlen:
      lines: 60
      statements: 40
    gocognit:
      min-complexity: 15
    govet:
      enable:
        - fieldalignment
    nestif:
      min-complexity: 5
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    staticcheck:
      checks:
        - all
    revive:
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: errorf
        - name: indent-error-flow
        - name: superfluous-else
        - name: empty-block
        - name: unreachable-code
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: use-any
        - name: use-errors-new
  exclusions:
    paths:
      - website

formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
    gofmt:
      simplify: true
