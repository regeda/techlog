<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">MCP architecture</title>
  <desc id="d">AI agents and developer tools connect through an MCP interface to the Techlog event and workflow engine, which connects to engineering and production systems.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#505050"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">
    <rect x="10" y="40" width="190" height="220" rx="12" fill="#252526" stroke="#505050"/>
    <text x="105" y="70" fill="#8f8f8f" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.5">CLIENTS</text>
    <rect x="30" y="92" width="150" height="40" rx="8" fill="#2d2d30" stroke="#3c3c3c"/><text x="105" y="117" fill="#f0f0f0">Coding agents</text>
    <rect x="30" y="144" width="150" height="40" rx="8" fill="#2d2d30" stroke="#3c3c3c"/><text x="105" y="169" fill="#f0f0f0">Triage agents</text>
    <rect x="30" y="196" width="150" height="40" rx="8" fill="#2d2d30" stroke="#3c3c3c"/><text x="105" y="221" fill="#f0f0f0">Developer tools</text>
    <rect x="250" y="40" width="190" height="220" rx="12" fill="#252526" stroke="#60a5fa" stroke-opacity=".6"/>
    <text x="345" y="70" fill="#60a5fa" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.5">MCP INTERFACE</text>
    <text x="345" y="120" fill="#c0c0c0" font-size="13">tools</text><text x="345" y="150" fill="#c0c0c0" font-size="13">resources</text><text x="345" y="180" fill="#c0c0c0" font-size="13">prompts</text>
    <text x="345" y="226" fill="#8f8f8f" font-size="11">interaction protocol only</text>
    <rect x="490" y="40" width="220" height="220" rx="12" fill="#252526" stroke="#2dd4bf" stroke-opacity=".6"/>
    <text x="600" y="70" fill="#2dd4bf" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.5">TECHLOG ENGINE</text>
    <text x="600" y="112" fill="#f0f0f0">Event model</text><text x="600" y="142" fill="#f0f0f0">Workflow engine</text><text x="600" y="172" fill="#f0f0f0">Policy evaluation</text>
    <text x="600" y="226" fill="#8f8f8f" font-size="11">defines event semantics</text>
    <rect x="760" y="40" width="190" height="220" rx="12" fill="#252526" stroke="#505050"/>
    <text x="855" y="70" fill="#8f8f8f" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.5">SYSTEMS</text>
    <rect x="780" y="92" width="150" height="34" rx="8" fill="#2d2d30" stroke="#3c3c3c"/><text x="855" y="114" fill="#f0f0f0" font-size="13">Git &amp; PRs</text>
    <rect x="780" y="134" width="150" height="34" rx="8" fill="#2d2d30" stroke="#3c3c3c"/><text x="855" y="156" fill="#f0f0f0" font-size="13">CI/CD</text>
    <rect x="780" y="176" width="150" height="34" rx="8" fill="#2d2d30" stroke="#3c3c3c"/><text x="855" y="198" fill="#f0f0f0" font-size="13">Observability</text>
    <rect x="780" y="218" width="150" height="34" rx="8" fill="#2d2d30" stroke="#3c3c3c"/><text x="855" y="240" fill="#f0f0f0" font-size="13">Incident tools</text>
  </g>
  <g stroke="#505050" stroke-width="1.5" marker-end="url(#a)"><path d="M200 150H246"/><path d="M440 150H486"/><path d="M710 150H756"/></g>
