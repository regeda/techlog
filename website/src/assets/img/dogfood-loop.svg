<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-labelledby="t d">
  <title id="t">Techlog is built with Techlog</title>
  <desc id="d">Two nodes joined in a loop: our work on Techlog is recorded as Techlog events, and those events shape our work on Techlog.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <rect x="30" y="85" width="170" height="70" rx="12" fill="#252526" stroke="#505050"/>
    <text x="115" y="115" fill="#f0f0f0" font-size="15" font-weight="600">Our work</text><text x="115" y="137" fill="#8f8f8f" font-size="12">on Techlog</text>
    <rect x="280" y="85" width="170" height="70" rx="12" fill="#252526" stroke="#2dd4bf" stroke-opacity=".7"/>
    <text x="365" y="115" fill="#f0f0f0" font-size="15" font-weight="600">Techlog events</text><text x="365" y="137" fill="#8f8f8f" font-size="12">recorded in Techlog</text>
  </g>
  <g fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)">
    <path d="M200 105 C 230 80, 250 80, 276 105"/>
    <path d="M280 135 C 250 160, 230 160, 204 135"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#8f8f8f" text-anchor="middle">
    <text x="240" y="70">we record it</text><text x="240" y="185">it shapes what we build</text>
  </g>
</svg>
